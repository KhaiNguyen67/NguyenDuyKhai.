<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 1</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <section class="banner">
        <h1 class="fade-in-text">Chào mừng đến với Lab 1 - Animation</h1>
    </section>

    <div class="container">
        <section id="buttons">
            <h2>Bài 1: Nút bấm đổi màu</h2>
            <div class="btn-group">
                <button class="btn">Nút số 1</button>
                <button class="btn">Nút số 2</button>
                <button class="btn">Nút số 3</button>
            </div>
        </section>

        <section id="gallery">
            <h2>Bài 2: Gallery phóng to ảnh</h2>
            <div class="grid-gallery">
                <div class="img-box"><img src="images/68992f500e9e44c4a2f9511e9ae8cdd3.jpg" alt=""></div>
                <div class="img-box"><img src="images/anh-mo-ta.jpg" alt=""></div>
                <div class="img-box"><img src="images/download.jpg" alt=""></div>
                <div class="img-box"><img src="images/ges.jpg" alt=""></div>
            </div>
        </section>

        <section id="menu">
            <h2>Bài 3: Menu gạch chân chạy</h2>
            <nav class="navbar">
                <ul>
                    <li><a href="#">Trang chủ</a></li>
                    <li><a href="#">Sản phẩm</a></li>
                    <li><a href="#">Dịch vụ</a></li>
                    <li><a href="#">Tin tức</a></li>
                    <li><a href="#">Liên hệ</a></li>
                </ul>
            </nav>
        </section>

        <section id="cards">
            <h2>Bài 4: Card sản phẩm nổi lên</h2>
            <div class="card-grid">
                <div class="card">
                    <img src="images/haha.jpg" alt="">
                    <div class="card-content">
                        <h3>Sản phẩm A</h3>
                        <p>Giá: 500.000đ</p>
                    </div>
                </div>
                <div class="card">
                    <img src="images/hehuhu.jpg" alt="">
                    <div class="card-content">
                        <h3>Sản phẩm B</h3>
                        <p>Giá: 750.000đ</p>
                    </div>
                </div>
                <div class="card">
                    <img src="images/hihi.jpg" alt="">
                    <div class="card-content">
                        <h3>Sản phẩm C</h3>
                        <p>Giá: 990.000đ</p>
                    </div>
                </div>
            </div>
        </section>
    </div>

</body>
</html>
