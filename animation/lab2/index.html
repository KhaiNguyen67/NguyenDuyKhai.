<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 2 - CSS Animation Keyframes</title>
    <link rel="stylesheet" href="asset/style.css">
</head>
<body>
    <h1 style="text-align: center;">Lab 2</h1>
    <section class="exercise">
        <h2>Bài 1: Text chạy ngang (Marquee)</h2>
        <div class="marquee-container">
            <span class="marquee-text">Hello</span>
        </div>
    </section>

    <section class="exercise">
        <h2>Bài 2: Hộp quay vòng</h2>
        <div class="rotate-box"></div>
    </section>

    <section class="exercise">
        <h2>Bài 3: Ảnh xuất hiện dần</h2>
        <div class="fade-container">
            <img src="images/anh-mo-ta.jpg" alt="" class="fade-img img-1">
            <img src="images/download.jpg" alt="" class="fade-img img-2">
            <img src="images/ges.jpg" alt="" class="fade-img img-3">
        </div>
    </section>

    <section class="exercise">
        <h2>Bài 4: Nút nhấp nháy</h2>
        <button class="cta-btn">MUA NGAY</button>
    </section>

    <section class="exercise">
        <h2>Bài 5: Slider ảnh tự động</h2>
        <div class="slider-container">
            <div class="slides">
                <img src="images/haha.jpg" alt="Slide 1">
                <img src="images/hehuhu.jpg" alt="Slide 2">
                <img src="images/hihi.jpg" alt="Slide 3">
            </div>
        </div>
    </section>

</body>
</html>
